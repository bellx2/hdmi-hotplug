name: Release

# v で始まるタグの push でリリースを作成する
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # タグ（v1.1.0）から先頭の v を除いた値をパッケージのバージョンにする
      - name: Build deb
        run: ./build-deb.sh "${GITHUB_REF_NAME#v}"

      # CHANGELOG.md からタグに対応する節（見出し行を除く）を取り出す。節が無ければ失敗させる
      - name: Extract release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md に ## [$GITHUB_REF_NAME] の節がありません"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" hdmi-hotplug_all.deb \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
